# Builds the static showcase and publishes it to GitHub Pages.
# Registrations are read from the Unstop sheet at build time: to pick up new
# teams, push to showcase or press "Run workflow" on the Actions tab.
# (GitHub only runs schedules from the default branch, so there's no timer.)
name: Pages

on:
  push:
    branches: [showcase]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: showcase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gives the site's path: /<repo> on github.io, empty on a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
